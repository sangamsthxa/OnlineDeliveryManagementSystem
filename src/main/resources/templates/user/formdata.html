    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.6/umd/popper.min.js" integrity="sha384-wHAiFfRlMFy6i5SRaxvfOCifBUQy1xHdJ/yoi7FRNXMRBu5WHdZYu1hA6ZOblgut" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/js/bootstrap.min.js" integrity="sha384-B0UglyR+jN6CkvvICOB2joaf5I4l3gm9GU6Hc1og6Ls7i6U/mkkaduKaBhlAXv9k" crossorigin="anonymous"></script>
<link rel="stylesheet" type="text/css"
	href="https://cdn.datatables.net/1.10.16/css/jquery.dataTables.min.css">
<link rel="stylesheet" type="text/css"
	href=" https://cdn.datatables.net/buttons/1.5.1/css/buttons.dataTables.min.css">

<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<script th:src="@{~/js/jquery.dataTables.min.js}" type="text/javascript"></script>
<style>
        .form-box{
    		margin-top: 40px;
    		border-radius: 10px;
    		padding: 30px 20px;
    		background-color: #f3f3f3;
    		box-sizing: border-box;
    		box-shadow: 10px 10px 5px #333;
    	}

    	.heading{
    		font-size: 2rem;
    		 color: red; 
    		 font-style: oblique;
    	}
.container{
    margin-top:20px;
}
.image-preview-input {
    position: relative;
    overflow: hidden;
    margin: 0px;    
    color: #333;
    background-color: #fff;
    border-color: #ccc;    
}
.image-preview-input input[type=file] {
	position: absolute;
	top: 0;
	right: 0;
	margin: 0;
	padding: 0;
	font-size: 20px;
	cursor: pointer;
	opacity: 0;
	filter: alpha(opacity=0);
}
.image-preview-input-title {
    margin-left:2px;
}


    </style>
    <th:block th:include="admin/fragements/head :: head"></th:block>
</head>

<body>
<th:block th:insert="admin/fragements/header :: header"></th:block>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
              <div class="row">
						<div class="col-md-12">
							<div class="card">
								<div class="card-header">
									<h3>Service List</h3>
								</div>
								<div class="card-body">
									<table id="serviceList" class="table">
										<thead>
											<tr>
											
												<th width="15px;">#</th>
												<th>Source Location</th>
												<th>Destination Location</th>
												<th>Distance</th>
										
											</tr>
										</thead>
										<tbody>
											
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
            </div>
        </div>
    </div>
    	<th:block th:include="admin/fragements/script :: body"></th:block>
    	
    <script type="text/javascript" th:src="@{~/custom/clientpost.js}"></script>
    
</body>



</html>
