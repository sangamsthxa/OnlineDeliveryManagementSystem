<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
<meta charset="ISO-8859-1">
<title>Add About us Content</title>
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
<!-- <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/jquery.bootstrapvalidator/0.5.2/css/bootstrapValidator.min.css"/>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/bootstrapValidator.js"></script> -->



<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>





<style>
}
.container {
	margin-top: 60px;
}
</style>
<th:block th:include="admin/dashboardfragement/dhead :: dheads"></th:block>
</head>

<body class="hold-transition skin-blue sidebar-mini">
	<th:block th:include="admin/dashboardfragement/sidebar :: div"></th:block>

	<!-- Content Wrapper. Contains page content -->
	<div class="content-wrapper">
		<!-- Content Header (Page header) -->
		<section class="content-header">
			<h1>
				Add About us Content<small>Control panel</small>
			</h1>
			<ol class="breadcrumb">
				<li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
				<li class="active">Add About us Content</li>
			</ol>
		</section>
		<section class="content">
			<div class="row">
				<!-- left column -->
				<div class="col-md-12">
					<!-- general form elements -->
					<div class="box box-primary">
						<div class="box-header with-border">
							<h3 class="box-title">Add New About us Content</h3>
						</div>
						<!-- /.box-header -->
						<!-- form start -->
						<form  th:action="@{/admin/save/about}"   method="POST">
							<div class="box-body">
								<div class="form-group col-md-6">
									<label for="title">About Us Title</label> <input type="text"
										class="form-control" id="title" name="title"
										placeholder="Enter Blog's Title" required>
								</div>
							
							</div><br>
							<div class="box-body">
								<div class="form-group col-md-6">
									<label for="description">AboutUs Description</label> <input type="text"
										class="form-control" id="description" name="description"
										placeholder="Enter Description" required>
								</div>
								</div>

							<!-- /.box-body -->

							<div class="box-footer">
								<button type="submit" class="btn btn-primary align-center" id="abt">Submit</button>
							</div>
						</form>
					</div>
					</div>
					<!-- /.box -->




				</div>
		</section>
		<!-- /.content -->
	</div>
	
	
	 
    
<th:block th:include="admin/dashboardfragement/dscript :: dscripts"></th:block>
</body>
<th:block th:replace="admin/dashboardfragement/footer :: foot"></th:block>

   <script type="text/javascript" th:src="@{~/js/sweetalert2.all.js}"></script>


  <script type="text/javascript" th:src="@{~/custom/other/saveAboutus.js}"></script>
</html>
