<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org/">
<head>
<meta charset="ISO-8859-1">
<title>Add User</title>
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
<!-- <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/jquery.bootstrapvalidator/0.5.2/css/bootstrapValidator.min.css"/>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-validator/0.5.3/js/bootstrapValidator.js"></script> -->



<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>





<style>
}
.container {
	margin-top: 60px;
}
</style>
<th:block th:include="admin/dashboardfragement/dhead :: dheads"></th:block>
</head>

<body class="hold-transition skin-blue sidebar-mini">
	<th:block th:include="admin/dashboardfragement/sidebar :: div"></th:block>

	<!-- Content Wrapper. Contains page content -->
	<div class="content-wrapper">
		<!-- Content Header (Page header) -->
		<section class="content-header">
			<h1>
				Add User <small>Control panel</small>
			</h1>
			<ol class="breadcrumb">
				<li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
				<li class="active">Add user</li>
			</ol>
		</section>
		<section class="content">
			<div class="row">
				<!-- left column -->
				<div class="col-md-12">
					<!-- general form elements -->
					<div class="box box-primary">
						<div class="box-header with-border">
							<h3 class="box-title">Add New User</h3>
						</div>
						<!-- /.box-header -->
						<!-- form start -->
						<form  th:action="@{/admin/registration}"   method="POST">
							<div class="box-body">
								<div class="form-group col-md-6">
									<label for="firstName">First Name</label> <input type="text"
										class="form-control" id="firstName" name="firstName"
										placeholder="Enter First Name">
								</div>
								<div class="form-group col-md-6">
									<label for="lastName">Last Name</label> <input type="text"
										class="form-control" id="lastName" name="lastName"
										placeholder="Enter Last Name">
								</div>
								<div class="form-group col-md-6">
									<label>Gender</label> <select name="gender" id="gender"class="form-control">
										<option value="Male">Male</option>
										<option value="Female">Female</option>
									</select>
								</div>
								<div class="form-group col-md-6">
									<label for="email">Email</label> <input
										type="email" class="form-control" id="email" name="email"
										placeholder="Enter email">
								</div>

								<div class="form-group col-md-6">
									<label for="contactNo">Contact No.</label> <input type="number"
										class="form-control" id="contactNo" name="contactNo" placeholder="Enter phone">
								</div>
								<div class="form-group col-md-6">
									<label for="address">Address</label> <input type="text"
										class="form-control" id="address" name="address"
										placeholder="Enter Address">
								</div>
								<div class="form-group col-md-6">
									<label for="dob">Date of Birth</label> <input type="date"
										class="form-control" id="dob" name="dob"
										placeholder="Enter Date of Birth">
								</div>

								<div class="form-group col-md-6">
									<label for="userName">UserName</label> <input type="text"
										class="form-control" id="userName" name="userName"
										placeholder="Enter Username">
								</div>
								<div class="form-group col-md-6">
									<label for="password">Password</label> <input
										type="password" class="form-control" name="password"
										id="password" placeholder="Password">
								</div>

								<div class="form-group col-md-6">
									<label>Role</label> <select name="roleName"   id="roles" class="form-control">
										<option value="admin">Admin</option>
										<option value="vendor">Vendor</option>
										<option value="client">Client</option>
									</select>
								</div>

							</div>

							<!-- /.box-body -->

							<div class="box-footer">
								<button type="submit" class="btn btn-primary align-center" id="sub">Submit</button>
							</div>
						</form>
					</div>
					</div>
					<!-- /.box -->




				</div>
		</section>
		<!-- /.content -->
	</div>
	
	
	 
    
<th:block th:include="admin/dashboardfragement/dscript :: dscripts"></th:block>
</body>
<th:block th:replace="admin/dashboardfragement/footer :: foot"></th:block>

   <script type="text/javascript" th:src="@{~/js/sweetalert2.all.js}"></script>


  <script type="text/javascript" th:src="@{~/custom/other/saveUser.js}"></script>
</html>
